<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footwear Stock Scanner</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- HTML5 QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- INLINE ICONS (Replacing lucide-react for standalone HTML support) ---
        const Camera = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>);
        const StopCircle = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="6" height="6"/></svg>);
        const Trash2 = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>);
        const Download = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>);
        const Package = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>);
        const CheckCircle2 = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>);
        const AlertCircle = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>);
        const Clock = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>);


        // --- MOCK DATABASE ---
        // This links the QR code alias to the full Main Product Name
        const productDatabase = {
          "1602": { fullName: "1602-Black-7x10", product: "1602", color: "Black", size: "7x10" },
          "1603": { fullName: "1603-White-8x11", product: "1603", color: "White", size: "8x11" },
          "1604": { fullName: "1604-Brown-6x9", product: "1604", color: "Brown", size: "6x9" },
          "1701": { fullName: "1701-Red-5x8", product: "1701", color: "Red", size: "5x8" },
          "1805": { fullName: "1805-Blue-9x12", product: "1805", color: "Blue", size: "9x12" },
        };

        function App() {
          const [isScanning, setIsScanning] = useState(false);
          // Changed to true because library is loaded via script tag in HTML head
          const [scannerLoaded, setScannerLoaded] = useState(true); 
          const [inventory, setInventory] = useState([]);
          const [cameraError, setCameraError] = useState("");
          
          const lastScanRef = useRef({ text: null, time: 0 });

          // Audio feedback for successful scan
          const playBeep = () => {
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator();
              const gainNode = ctx.createGain();
              osc.connect(gainNode);
              gainNode.connect(ctx.destination);
              osc.type = "sine";
              osc.frequency.setValueAtTime(880, ctx.currentTime);
              gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
              osc.start();
              osc.stop(ctx.currentTime + 0.1);
            } catch (e) {
              console.log("Audio not supported");
            }
          };

          // Handle a successful QR scan
          const handleScan = useCallback((decodedText) => {
            const now = Date.now();
            
            // Prevent duplicate scans of the same item within 3 seconds
            if (lastScanRef.current.text === decodedText && (now - lastScanRef.current.time) < 3000) {
              return;
            }
            lastScanRef.current = { text: decodedText, time: now };
            
            playBeep();

            // Look up the alias in our database
            const productInfo = productDatabase[decodedText] || {
              fullName: `Unknown (${decodedText})`,
              product: decodedText,
              color: "N/A",
              size: "N/A",
              isUnknown: true
            };

            // Used Date.now() for ID to ensure it works on local file:// execution safely
            setInventory(prev => [{
              id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
              scannedAt: new Date(),
              alias: decodedText,
              ...productInfo
            }, ...prev]);
          }, []);

          // Manage Scanner Lifecycle
          useEffect(() => {
            let html5QrCode;

            if (isScanning && scannerLoaded && window.Html5Qrcode) {
              setCameraError("");
              html5QrCode = new window.Html5Qrcode("reader");
              const config = { fps: 10, qrbox: { width: 250, height: 250 } };

              html5QrCode.start({ facingMode: "environment" }, config, handleScan)
                .catch((err) => {
                  console.error("Camera error:", err);
                  setCameraError("Could not start camera. Please check permissions or try another browser.");
                  setIsScanning(false);
                });
            }

            return () => {
              if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                  html5QrCode.clear();
                }).catch(err => console.error("Failed to stop scanner", err));
              }
            };
          }, [isScanning, scannerLoaded, handleScan]);

          const exportCSV = () => {
            const headers = "Date,Time,Alias,Main Product Name,Color,Size\n";
            const rows = inventory.map(item => {
              const date = item.scannedAt.toLocaleDateString();
              const time = item.scannedAt.toLocaleTimeString();
              return `"${date}","${time}","${item.alias}","${item.fullName}","${item.color}","${item.size}"`;
            }).join("\n");
            
            const blob = new Blob([headers + rows], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Footwear_Stock_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
          };

          const clearRecords = () => {
            if (window.confirm("Are you sure you want to clear all scanned records?")) {
              setInventory([]);
            }
          };

          return (
            <div className="min-h-screen bg-slate-50 font-sans text-slate-800 pb-20">
              {/* Header */}
              <header className="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-10">
                <div className="max-w-4xl mx-auto flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <Package className="w-6 h-6 text-blue-400" />
                    <h1 className="text-xl font-bold tracking-tight">Footwear Stock Scanner</h1>
                  </div>
                  <div className="text-sm bg-slate-800 px-3 py-1 rounded-full text-slate-300 font-medium border border-slate-700">
                    Records: <span className="text-white font-bold">{inventory.length}</span>
                  </div>
                </div>
              </header>

              <main className="max-w-4xl mx-auto p-4 space-y-6 mt-4">
                
                {/* Scanner Section */}
                <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <h2 className="text-lg font-semibold flex items-center gap-2">
                      <Camera className="w-5 h-5 text-slate-500" />
                      QR Scanner
                    </h2>
                    <button
                      onClick={() => setIsScanning(!isScanning)}
                      disabled={!scannerLoaded}
                      className={`flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-colors ${
                        isScanning 
                          ? 'bg-red-50 text-red-600 hover:bg-red-100 border border-red-200' 
                          : 'bg-blue-600 text-white hover:bg-blue-700 shadow-sm'
                      } disabled:opacity-50`}
                    >
                      {isScanning ? (
                        <><StopCircle className="w-4 h-4" /> Stop Camera</>
                      ) : (
                        <><Camera className="w-4 h-4" /> Start Camera</>
                      )}
                    </button>
                  </div>

                  <div className="p-4 flex flex-col items-center justify-center min-h-[300px] bg-slate-100 relative">
                    {cameraError && (
                      <div className="absolute top-4 left-4 right-4 bg-red-100 text-red-700 p-3 rounded-lg text-sm flex items-start gap-2 z-10 shadow-sm">
                        <AlertCircle className="w-5 h-5 shrink-0" />
                        <p>{cameraError}</p>
                      </div>
                    )}
                    
                    <div 
                      id="reader" 
                      className={`w-full max-w-sm rounded-xl overflow-hidden bg-black shadow-inner ${!isScanning ? 'hidden' : 'block'}`}
                    ></div>
                    
                    {!isScanning && (
                      <div className="text-center text-slate-500 space-y-3">
                        <div className="w-16 h-16 bg-slate-200 rounded-full flex items-center justify-center mx-auto mb-2">
                          <Camera className="w-8 h-8 text-slate-400" />
                        </div>
                        <p>Click "Start Camera" to begin scanning footwear codes.</p>
                        <p className="text-sm text-slate-400 max-w-xs mx-auto">
                          Make sure your QR codes contain the alias (e.g., 1602) to map to the Main Product Name.
                        </p>
                      </div>
                    )}
                  </div>
                </section>

                {/* Stock Records List */}
                <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-4 border-b border-slate-100 flex flex-wrap justify-between items-center gap-4 bg-slate-50/50">
                    <h2 className="text-lg font-semibold flex items-center gap-2">
                      <Clock className="w-5 h-5 text-slate-500" />
                      Recent Scans
                    </h2>
                    <div className="flex gap-2">
                      <button 
                        onClick={exportCSV}
                        disabled={inventory.length === 0}
                        className="flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 disabled:opacity-50 transition-colors shadow-sm"
                      >
                        <Download className="w-4 h-4" />
                        Export CSV
                      </button>
                      <button 
                        onClick={clearRecords}
                        disabled={inventory.length === 0}
                        className="flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-red-600 bg-white border border-red-200 rounded-lg hover:bg-red-50 disabled:opacity-50 transition-colors shadow-sm"
                      >
                        <Trash2 className="w-4 h-4" />
                        Clear
                      </button>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    {inventory.length === 0 ? (
                      <div className="p-12 text-center text-slate-500">
                        <Package className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                        <p>No items scanned yet.</p>
                      </div>
                    ) : (
                      <table className="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                          <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                            <th className="p-4 font-medium border-b border-slate-200">Time</th>
                            <th className="p-4 font-medium border-b border-slate-200">Main Product Name</th>
                            <th className="p-4 font-medium border-b border-slate-200">Alias</th>
                            <th className="p-4 font-medium border-b border-slate-200">Color</th>
                            <th className="p-4 font-medium border-b border-slate-200">Size</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {inventory.map((item) => (
                            <tr key={item.id} className="hover:bg-slate-50 transition-colors group">
                              <td className="p-4 text-sm text-slate-500 whitespace-nowrap">
                                {item.scannedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                              </td>
                              <td className="p-4">
                                <div className="flex items-center gap-2">
                                  {item.isUnknown ? (
                                    <AlertCircle className="w-4 h-4 text-amber-500 shrink-0" />
                                  ) : (
                                    <CheckCircle2 className="w-4 h-4 text-emerald-500 shrink-0" />
                                  )}
                                  <span className={`font-semibold ${item.isUnknown ? 'text-amber-700' : 'text-slate-800'}`}>
                                    {item.fullName}
                                  </span>
                                </div>
                              </td>
                              <td className="p-4">
                                <span className="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-slate-100 text-slate-600">
                                  {item.alias}
                                </span>
                              </td>
                              <td className="p-4 text-sm text-slate-600">{item.color}</td>
                              <td className="p-4 text-sm text-slate-600">{item.size}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                </section>
              </main>
            </div>
          );
        }

        // Render the React application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
