<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footwear Stock Scanner</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- HTML5 QR Code Library for Scanning -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- SheetJS for Reading Excel files locally -->
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- INLINE ICONS ---
        const Camera = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>);
        const StopCircle = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="6" height="6"/></svg>);
        const Trash2 = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>);
        const Download = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>);
        const Package = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>);
        const CheckCircle2 = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>);
        const AlertCircle = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>);
        const Clock = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>);
        const Settings = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>);
        const Upload = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>);
        const DatabaseIcon = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>);
        const IndusLogo = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 14.2l-3.3-3.6c-.6-.7-1.6-1-2.5-.8L12.6 11H9.8c-1.3 0-2.4-.9-2.7-2.2L6.8 7.3C6.4 5.9 5.2 5 3.8 5H2v2h1.8c.6 0 1.2.4 1.4 1l.3 1.5c.6 2.6 2.9 4.5 5.6 4.5h3l2.8-.8c.2-.1.4 0 .6.2l2.3 2.5c.8.9 2 1.4 3.2 1.4h1V15h-1c-.5 0-1-.2-1.4-.8z"/><path d="M18 19h-5.2c-1.8 0-3.5-.7-4.8-1.9L6 15.3c-.6-.5-1.5-.6-2.2-.2-1 .6-1.5 1.7-1.2 2.8.2.8.9 1.5 1.7 1.8l3 .9c1.5.5 3.1.7 4.7.7H18c1.1 0 2-.9 2-2s-.9-2-2-2z"/></svg>);

        function App() {
          // View state: 'scanner' or 'admin'
          const [activeTab, setActiveTab] = useState('scanner');

          // Load DB from LocalStorage so it persists across reloads
          const [productDatabase, setProductDatabase] = useState(() => {
            const savedDb = localStorage.getItem('footwear_db');
            return savedDb ? JSON.parse(savedDb) : {};
          });

          const [isScanning, setIsScanning] = useState(false);
          const [scannerLoaded, setScannerLoaded] = useState(true); 
          const [inventory, setInventory] = useState([]);
          const [cameraError, setCameraError] = useState("");
          
          const lastScanRef = useRef({ text: null, time: 0 });

          const playBeep = () => {
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator();
              const gainNode = ctx.createGain();
              
              osc.connect(gainNode);
              gainNode.connect(ctx.destination);
              
              // A bright "success" double-beep sound
              osc.type = "sine";
              osc.frequency.setValueAtTime(800, ctx.currentTime); // First note
              osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.1); // Second higher note
              
              // Increased volume (0.5 instead of 0.1)
              gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
              
              osc.start();
              osc.stop(ctx.currentTime + 0.25); // Slightly longer duration
            } catch (e) {
              console.log("Audio not supported");
            }
          };

          // Excel Upload Handler for Admin Panel
          const handleExcelUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = window.XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = window.XLSX.utils.sheet_to_json(worksheet, { header: 1 }); 
                    
                    const newDb = {};
                    let count = 0;

                    json.forEach((row) => {
                        // Ensure row has at least 2 columns
                        if (row && row.length >= 2) {
                            const originalAlias = String(row[0]).trim();
                            // Fix: Strip slash in Excel too, and UPPERCASE for robust matching
                            const lookupKey = originalAlias.split('/')[0].trim().toUpperCase();
                            const name = String(row[1]).trim();
                            
                            // Skip header row if it contains the word "alias"
                            if (lookupKey && lookupKey.toLowerCase() !== 'alias') {
                                // Store under the UPPERCASE stripped key
                                newDb[lookupKey] = { fullName: name, alias: originalAlias };
                                count++;
                            }
                        }
                    });

                    setProductDatabase(newDb);
                    localStorage.setItem('footwear_db', JSON.stringify(newDb));
                    alert(`Success! Synced ${count} products to the database.`);
                    
                    // Reset input
                    e.target.value = null;
                } catch(error) {
                    alert("Error parsing file. Please ensure it's a valid .xlsx or .csv file.");
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
          };

          // QR Scanner Handler
          const handleScan = useCallback((decodedText) => {
            const now = Date.now();
            
            // Prevent accidental double scans of same barcode within 3 seconds
            if (lastScanRef.current.text === decodedText && (now - lastScanRef.current.time) < 3000) {
              return;
            }
            lastScanRef.current = { text: decodedText, time: now };
            
            playBeep();

            // Logic to split the alias from the scanned code
            // Ex: "N-176438/12345" -> Splits by "/" -> Gets "N-176438"
            const extractedAlias = decodedText.split('/')[0].trim();
            
            // Fix: Convert to UPPERCASE before checking to guarantee it matches the DB
            const lookupKey = extractedAlias.toUpperCase();

            // Look it up using the normalized key
            const productInfo = productDatabase[lookupKey] || {
              fullName: `Unknown (${extractedAlias})`,
              alias: extractedAlias,
              isUnknown: true
            };

            setInventory(prev => [{
              id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
              scannedAt: new Date(),
              fullCode: decodedText,
              extractedAlias: extractedAlias,
              quantity: 1, // Default quantity field
              ...productInfo
            }, ...prev]);
          }, [productDatabase]);

          // Camera Lifecycle
          useEffect(() => {
            let html5QrCode;

            if (isScanning && scannerLoaded && window.Html5Qrcode && activeTab === 'scanner') {
              setCameraError("");
              html5QrCode = new window.Html5Qrcode("reader");
              const config = { fps: 10, qrbox: { width: 250, height: 250 } };

              html5QrCode.start({ facingMode: "environment" }, config, handleScan)
                .catch((err) => {
                  console.error("Camera error:", err);
                  setCameraError("Could not start camera. Please check permissions or try another browser.");
                  setIsScanning(false);
                });
            }

            return () => {
              if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                  html5QrCode.clear();
                }).catch(err => console.error("Failed to stop scanner", err));
              }
            };
          }, [isScanning, scannerLoaded, handleScan, activeTab]);

          const updateQuantity = (id, newQuantity) => {
            const val = parseInt(newQuantity);
            setInventory(prev => prev.map(item => 
              item.id === id ? { ...item, quantity: isNaN(val) || val < 1 ? 1 : val } : item
            ));
          };

          const deleteRecord = (id) => {
            setInventory(prev => prev.filter(item => item.id !== id));
          };

          const exportCSV = () => {
            const headers = "Date,Time,Full Scanned Code,Extracted Alias,Main Product Name,Quantity\n";
            const rows = inventory.map(item => {
              const date = item.scannedAt.toLocaleDateString();
              const time = item.scannedAt.toLocaleTimeString();
              return `"${date}","${time}","${item.fullCode}","${item.extractedAlias}","${item.fullName}","${item.quantity}"`;
            }).join("\n");
            
            const blob = new Blob([headers + rows], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Footwear_Stock_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
          };

          const clearRecords = () => {
            if (window.confirm("Are you sure you want to clear all scanned records?")) {
              setInventory([]);
            }
          };

          return (
            <div className="min-h-screen bg-teal-50/40 font-sans text-slate-800 pb-20">
              {/* Header & Tabs */}
              <header className="bg-teal-900 text-teal-50 shadow-md sticky top-0 z-10">
                <div className="max-w-4xl mx-auto p-4 flex justify-between items-center">
                  <div className="flex items-center gap-3">
                    <div className="p-2 bg-teal-800 rounded-lg border border-teal-700 shadow-sm">
                      <IndusLogo className="w-6 h-6 text-teal-300" />
                    </div>
                    <h1 className="text-xl font-bold tracking-tight text-white">Indus Footwear</h1>
                  </div>
                  {activeTab === 'scanner' && (
                    <div className="text-sm bg-teal-800 px-3 py-1 rounded-full text-teal-100 font-medium border border-teal-700 shadow-inner">
                      Scanned: <span className="text-white font-bold">{inventory.length}</span>
                    </div>
                  )}
                </div>
                {/* Navigation Tabs */}
                <div className="max-w-4xl mx-auto px-4 flex gap-4 border-t border-teal-800">
                  <button 
                    onClick={() => setActiveTab('scanner')}
                    className={`px-4 py-3 text-sm font-medium border-b-2 transition-colors flex items-center gap-2 ${activeTab === 'scanner' ? 'border-teal-400 text-teal-300' : 'border-transparent text-teal-100/70 hover:text-teal-50'}`}
                  >
                    <Camera className="w-4 h-4" /> Scanner
                  </button>
                  <button 
                    onClick={() => {
                      setActiveTab('admin');
                      setIsScanning(false); // Stop camera if navigating away
                    }}
                    className={`px-4 py-3 text-sm font-medium border-b-2 transition-colors flex items-center gap-2 ${activeTab === 'admin' ? 'border-teal-400 text-teal-300' : 'border-transparent text-teal-100/70 hover:text-teal-50'}`}
                  >
                    <Settings className="w-4 h-4" /> Admin Panel
                  </button>
                </div>
              </header>

              <main className="max-w-4xl mx-auto p-4 space-y-6 mt-4">
                
                {/* --- SCANNER VIEW --- */}
                {activeTab === 'scanner' && (
                  <>
                    <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                        <h2 className="text-lg font-semibold flex items-center gap-2">
                          <Camera className="w-5 h-5 text-teal-600" />
                          QR Scanner
                        </h2>
                        <button
                          onClick={() => setIsScanning(!isScanning)}
                          disabled={!scannerLoaded}
                          className={`flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-colors ${
                            isScanning 
                              ? 'bg-red-50 text-red-600 hover:bg-red-100 border border-red-200' 
                              : 'bg-teal-600 text-white hover:bg-teal-700 shadow-sm'
                          } disabled:opacity-50`}
                        >
                          {isScanning ? (
                            <><StopCircle className="w-4 h-4" /> Stop Camera</>
                          ) : (
                            <><Camera className="w-4 h-4" /> Start Camera</>
                          )}
                        </button>
                      </div>

                      <div className="p-4 flex flex-col items-center justify-center min-h-[300px] bg-slate-100 relative">
                        {cameraError && (
                          <div className="absolute top-4 left-4 right-4 bg-red-100 text-red-700 p-3 rounded-lg text-sm flex items-start gap-2 z-10 shadow-sm">
                            <AlertCircle className="w-5 h-5 shrink-0" />
                            <p>{cameraError}</p>
                          </div>
                        )}
                        
                        <div 
                          id="reader" 
                          className={`w-full max-w-sm rounded-xl overflow-hidden bg-black shadow-inner ${!isScanning ? 'hidden' : 'block'}`}
                        ></div>
                        
                        {!isScanning && (
                          <div className="text-center text-slate-500 space-y-3">
                            <div className="w-16 h-16 bg-slate-200 rounded-full flex items-center justify-center mx-auto mb-2">
                              <Camera className="w-8 h-8 text-slate-400" />
                            </div>
                            <p>Click "Start Camera" to begin scanning footwear codes.</p>
                            <p className="text-sm text-slate-400 max-w-xs mx-auto">
                              Scanning formats like "N-176438/12345" will automatically extract "N-176438" to look up the Product Name.
                            </p>
                          </div>
                        )}
                      </div>
                    </section>

                    {/* Stock Records List */}
                    <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="p-4 border-b border-slate-100 flex flex-wrap justify-between items-center gap-4 bg-slate-50/50">
                        <h2 className="text-lg font-semibold flex items-center gap-2">
                          <Clock className="w-5 h-5 text-slate-500" />
                          Recent Scans
                        </h2>
                        <div className="flex gap-2">
                          <button 
                            onClick={exportCSV}
                            disabled={inventory.length === 0}
                            className="flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 disabled:opacity-50 transition-colors shadow-sm"
                          >
                            <Download className="w-4 h-4" />
                            Export CSV
                          </button>
                          <button 
                            onClick={clearRecords}
                            disabled={inventory.length === 0}
                            className="flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-red-600 bg-white border border-red-200 rounded-lg hover:bg-red-50 disabled:opacity-50 transition-colors shadow-sm"
                          >
                            <Trash2 className="w-4 h-4" />
                            Clear
                          </button>
                        </div>
                      </div>

                      <div className="overflow-x-auto">
                        {inventory.length === 0 ? (
                          <div className="p-12 text-center text-slate-500">
                            <IndusLogo className="w-12 h-12 text-teal-200 mx-auto mb-3" />
                            <p>No items scanned yet.</p>
                          </div>
                        ) : (
                          <table className="w-full text-left border-collapse min-w-[700px]">
                            <thead>
                              <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                                <th className="p-4 font-medium border-b border-slate-200">Time</th>
                                <th className="p-4 font-medium border-b border-slate-200">Product Name</th>
                                <th className="p-4 font-medium border-b border-slate-200">Alias Extracted</th>
                                <th className="p-4 font-medium border-b border-slate-200 w-24 text-center">Quantity</th>
                                <th className="p-4 font-medium border-b border-slate-200 w-20 text-center">Actions</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {inventory.map((item) => (
                                <tr key={item.id} className="hover:bg-slate-50 transition-colors group">
                                  <td className="p-4 text-sm text-slate-500 whitespace-nowrap">
                                    {item.scannedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                                  </td>
                                  <td className="p-4">
                                    <div className="flex flex-col">
                                      <div className="flex items-center gap-2">
                                        {item.isUnknown ? (
                                          <AlertCircle className="w-4 h-4 text-amber-500 shrink-0" />
                                        ) : (
                                          <CheckCircle2 className="w-4 h-4 text-emerald-500 shrink-0" />
                                        )}
                                        <span className={`font-semibold ${item.isUnknown ? 'text-amber-700' : 'text-slate-800'}`}>
                                          {item.fullName}
                                        </span>
                                      </div>
                                      <span className="text-xs text-slate-400 mt-1 pl-6 line-clamp-1" title={item.fullCode}>
                                        Full Code: {item.fullCode}
                                      </span>
                                    </div>
                                  </td>
                                  <td className="p-4">
                                    <span className="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-slate-100 text-slate-600">
                                      {item.extractedAlias}
                                    </span>
                                  </td>
                                  <td className="p-4">
                                    <input 
                                      type="number" 
                                      min="1"
                                      value={item.quantity}
                                      onChange={(e) => updateQuantity(item.id, e.target.value)}
                                      className="w-16 px-2 py-1 text-center border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500"
                                    />
                                  </td>
                                  <td className="p-4 text-center">
                                    <button 
                                      onClick={() => deleteRecord(item.id)}
                                      className="flex items-center justify-center gap-1 px-3 py-1.5 text-red-600 bg-red-50 hover:bg-red-100 border border-red-100 rounded-lg transition-colors mx-auto"
                                      title="Delete Record"
                                    >
                                      <Trash2 className="w-4 h-4" />
                                      <span className="text-xs font-semibold">Delete</span>
                                    </button>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        )}
                      </div>
                    </section>
                  </>
                )}

                {/* --- ADMIN PANEL VIEW --- */}
                {activeTab === 'admin' && (
                  <div className="space-y-6">
                    <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="p-6 border-b border-slate-100 bg-teal-50/30">
                        <h2 className="text-xl font-semibold flex items-center gap-2 mb-2">
                          <DatabaseIcon className="w-6 h-6 text-teal-600" />
                          Database Management
                        </h2>
                        <p className="text-slate-500 text-sm">
                          Upload an Excel (.xlsx) or CSV file containing your Alias to Product Name mappings.
                        </p>
                      </div>
                      
                      <div className="p-6">
                        <div className="flex flex-col items-center justify-center border-2 border-dashed border-teal-200 rounded-xl p-8 bg-teal-50/50 hover:bg-teal-50 transition-colors">
                          <Upload className="w-10 h-10 text-teal-400 mb-4" />
                          <label className="cursor-pointer bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded-lg font-medium shadow-sm transition-colors mb-4">
                            Upload Excel / CSV
                            <input 
                              type="file" 
                              accept=".xlsx, .xls, .csv" 
                              className="hidden" 
                              onChange={handleExcelUpload}
                            />
                          </label>
                          <div className="text-sm text-slate-500 text-center space-y-1">
                            <p><strong>Required Format:</strong></p>
                            <p>Column 1: Alias Number (e.g., N-176438)</p>
                            <p>Column 2: Main Product Name</p>
                          </div>
                        </div>

                        <div className="mt-8">
                          <div className="flex justify-between items-center mb-4">
                            <h3 className="font-semibold text-slate-700">Current Database Status</h3>
                            <span className="text-sm px-3 py-1 bg-teal-100 text-teal-800 rounded-full font-medium">
                              {Object.keys(productDatabase).length} Products Loaded
                            </span>
                          </div>
                          
                          {Object.keys(productDatabase).length > 0 ? (
                            <div className="bg-slate-50 rounded-lg border border-slate-200 overflow-y-auto max-h-64">
                              <table className="w-full text-left text-sm">
                                <thead className="bg-slate-100 sticky top-0">
                                  <tr>
                                    <th className="p-3 font-medium text-slate-600">Alias Lookup Key</th>
                                    <th className="p-3 font-medium text-slate-600">Main Product Name</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200">
                                  {/* Showing only first 50 as preview to keep UI fast */}
                                  {Object.entries(productDatabase).slice(0, 50).map(([key, prod], idx) => (
                                    <tr key={idx}>
                                      <td className="p-3 text-slate-700 font-medium">{key}</td>
                                      <td className="p-3 text-slate-600">{prod.fullName}</td>
                                    </tr>
                                  ))}
                                  {Object.keys(productDatabase).length > 50 && (
                                    <tr>
                                      <td colSpan="2" className="p-3 text-center text-slate-500 italic">
                                        ... and {Object.keys(productDatabase).length - 50} more items hidden from preview.
                                      </td>
                                    </tr>
                                  )}
                                </tbody>
                              </table>
                            </div>
                          ) : (
                            <div className="text-center py-6 text-slate-400 border border-slate-200 rounded-lg bg-slate-50">
                              No products uploaded yet. Scanner will show products as "Unknown".
                            </div>
                          )}
                        </div>
                      </div>
                    </section>
                  </div>
                )}
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
